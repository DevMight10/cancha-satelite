<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cancha Satélite Norte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/base.css" rel="stylesheet">
</head>
<body>
  <header class="hero text-white text-center">
    <div class="container py-5">
      <h1 class="display-5 fw-bold">Cancha Satélite Norte</h1>
      <p class="lead mb-0">Reserva y paga tu horario en línea</p>

  <main class="container py-5">

      <div class="card-body">
        <h2 class="h5 card-title">Estado del sistema</h2>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between">
            API (backend)
            <span id="estado-api" class="badge text-bg-secondary">verificando…</span>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            Base de datos
            <span id="estado-db" class="badge text-bg-secondary">verificando…</span>
          </li>
        </ul>
      </div>
    </div>
  </main>

  <script type="module" src="/js/pages/inicio.js"></script>

</html>
