<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis reservas · Cancha Satélite Norte</title>
  <meta name="theme-color" content="#0b0d0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../assets/css/app.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="../../js/pages/misReservas.js"></script>
</head>
<body>
  <header id="cabecera" class="cabecera"></header>

  <main class="contenedor">
    <section class="encabezado-pagina">
      <div class="fila">
        <div>
          <h1 class="titulo-pagina">Mis reservas</h1>
          <p class="subtitulo">Tus partidos próximos y el historial.</p>
        </div>
        <a class="btn btn-primario" href="../../pages/reservar.html"><i data-lucide="calendar-plus"></i>Nueva reserva</a>
      </div>
    </section>

    <div class="pestanas" role="tablist" aria-label="Filtrar reservas">
      <button type="button" class="pestana" role="tab" aria-selected="true" data-vista="proximas" id="tab-proximas" aria-controls="lista">Próximas</button>
      <button type="button" class="pestana" role="tab" aria-selected="false" data-vista="historial" id="tab-historial" aria-controls="lista">Historial</button>
    </div>

    <section id="lista" class="lista-reservas" role="tabpanel" aria-live="polite">
      <div class="esqueleto bloque-cargando"></div>
    </section>
  </main>
</body>
</html>
