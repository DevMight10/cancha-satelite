<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cronograma · Cancha Satélite Norte</title>
  <meta name="theme-color" content="#0b0d0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
  <link href="/assets/css/admin.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="/js/pages/admin/panel.js"></script>
</head>
<body>
  <header id="cabecera" class="cabecera"></header>
  <div class="admin">
    <nav id="admin-nav" class="admin-nav" aria-label="Administración"></nav>
    <main class="admin-main">
      <div class="admin-encabezado">
        <div>
          <h1 class="admin-titulo">Cronograma</h1>
          <p class="admin-subtitulo" id="rango-semana">&nbsp;</p>
        </div>
        <div class="selector-fecha">
          <button type="button" class="btn btn-icono" id="semana-anterior" aria-label="Semana anterior"><i data-lucide="chevron-left"></i></button>
          <button type="button" class="btn" id="hoy">Esta semana</button>
          <button type="button" class="btn btn-icono" id="semana-siguiente" aria-label="Semana siguiente"><i data-lucide="chevron-right"></i></button>
          <input type="date" class="control" id="fecha" aria-label="Ir a una fecha">
        </div>
      </div>

      <div id="aviso-pagos"></div>
      <dl class="resumen-dia" id="resumen" aria-live="polite"></dl>

      <section class="crono" aria-labelledby="titulo-crono">
        <h2 class="visualmente-oculto" id="titulo-crono">Reservas de la semana</h2>
        <div id="cronograma"><div class="esqueleto bloque-cargando"></div></div>
        <div class="crono-leyenda" aria-hidden="true">
          <span><i class="l-ok"></i>Confirmada</span><span><i class="l-pend"></i>Por cobrar / en revisión</span>
          <span><i class="l-libre"></i>Libre (toca para registrar)</span><span><i class="l-cerrado"></i>Cerrado</span>
        </div>
      </section>

      <section class="detalle-dia" aria-labelledby="titulo-agenda">
        <h2 class="bloque-titulo" id="titulo-agenda">Agenda del día</h2>
        <div class="agenda" id="agenda"></div>
      </section>
    </main>
  </div>
</body>
</html>
