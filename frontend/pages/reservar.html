<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar · Cancha Satélite Norte</title>
  <meta name="theme-color" content="#0b0d0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="/js/pages/reservar.js"></script>
</head>
<body class="pagina-reservar">
  <header id="cabecera" class="cabecera"></header>

  <main class="contenedor reservar-pagina">
    <div class="encabezado-pagina">
      <h1 class="titulo-pagina">Reserva tu cancha</h1>
      <p class="subtitulo" id="reglas">Elige un día en el calendario y luego tu horario.</p>
    </div>

    <div class="reserva-panel">
      <section class="panel-calendario" aria-labelledby="titulo-calendario">
        <h2 class="visualmente-oculto" id="titulo-calendario">Elige el día</h2>
        <div id="calendario"><div class="esqueleto bloque-cargando"></div></div>
      </section>

      <section class="panel-horarios" aria-labelledby="titulo-dia">
        <header class="panel-horarios-cabecera">
          <h2 id="titulo-dia">&nbsp;</h2>
          <span class="chip chip-confirmada" id="libres-dia" hidden></span>
        </header>
        <div class="horarios" id="marcador" aria-live="polite"></div>
        <div class="resumen" id="resumen" aria-live="polite"></div>
      </section>
    </div>
  </main>
</body>
</html>
