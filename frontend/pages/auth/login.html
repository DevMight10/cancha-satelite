<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Cancha Satélite Norte</title>
  <meta name="theme-color" content="#0b0d0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
  <header id="cabecera" class="cabecera"></header>

  <main class="auth">
    <div class="auth-cancha"><div id="auth-cancha-fondo"></div>
      <div class="auth-cancha-texto"><h2>Tu cancha,<br><span>a un toque.</span></h2><p>Mira los horarios libres, reserva y paga con QR, Tigo Money o transferencia.</p></div>
    </div>
    <div class="auth-formulario">
    <section class="auth-tarjeta" aria-labelledby="titulo">
      <h1 id="titulo">Entrar</h1>
      <p class="subtitulo">Reserva tu hora y sigue tus partidos.</p>

      <form id="form-login" class="formulario" novalidate>
        <div class="aviso aviso-error" data-error-general hidden role="alert">
          <i data-lucide="circle-alert"></i><span></span>
        </div>

        <div class="campo">
          <label for="email">Correo</label>
          <input class="control" id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
          <p class="error-campo"></p>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input class="control" id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="error-campo"></p>
        </div>

        <button type="submit" class="btn btn-primario btn-bloque">Entrar</button>
      </form>

      <p class="auth-pie">¿Primera vez? <a href="/pages/auth/registro.html">Crea tu cuenta</a></p>
    </section>
    </div>
  </main>
</body>
</html>
